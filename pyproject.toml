[project]
name = "datakit"
version = "0.2.0"
description = "Small utilities for validating and transforming tabular records."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9,<3",
]

[project.scripts]
datakit-summary = "datakit.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
